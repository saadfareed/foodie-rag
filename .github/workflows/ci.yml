name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
        # app/config.py builds its Settings singleton at import time and _require()s these, so
        # `import app.anything` -- including tests/conftest.py -- fails without them. Locally a
        # .env supplies them; CI has none, so they're spelled out here.
        #
        # The values are deliberately obvious placeholders. Nothing in the suite makes a real
        # Slack, Gemini or MongoDB call (every one is stubbed), so these only have to be
        # non-empty to get past validation -- they are not secrets and must never become real
        # ones. If a test ever needs a genuine credential, that's a sign it stopped being a
        # unit test.
        env:
          SLACK_BOT_TOKEN: ci-placeholder-not-a-real-token
          SLACK_APP_TOKEN: ci-placeholder-not-a-real-token
          SLACK_SIGNING_SECRET: ci-placeholder-not-a-real-secret
          GEMINI_API_KEY: ci-placeholder-not-a-real-key
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB_NAME: ci_test_db

  redis-integration:
    name: Shared state (real Redis)
    runs-on: ubuntu-latest
    # tests/test_redis_integration.py skips itself unless REDIS_TEST_URL is set, so the main Tests
    # job stays hermetic. This job is where the two Lua scripts in app/state/redis_backend.py --
    # the atomic counter and the sliding window -- are actually executed. A fake client can prove
    # they were called with the right arguments and nothing more, and those scripts are exactly
    # where the cross-replica guarantees live.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-dev.txt redis
      - run: pytest tests/test_redis_integration.py -v
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379/15
          # Same placeholders as the Tests job: app/config.py _require()s these at import time.
          SLACK_BOT_TOKEN: ci-placeholder-not-a-real-token
          SLACK_APP_TOKEN: ci-placeholder-not-a-real-token
          SLACK_SIGNING_SECRET: ci-placeholder-not-a-real-secret
          GEMINI_API_KEY: ci-placeholder-not-a-real-key
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB_NAME: ci_test_db

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  sast:
    name: Static security analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit
      - run: bandit -r app

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-dev.txt
      - run: pip-audit

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan for hardcoded secrets
        run: gitleaks detect --source . --redact -v
