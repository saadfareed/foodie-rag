[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "uses_mongo_client: opts out of the conftest tripwire that refuses real MongoClient construction",
    "answer_result: the AnswerResult the stubbed pipeline should return (tests/test_api.py)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
